name: Update Ivey alumni calendar

on:
  schedule:
    - cron: "17 10 * * *"   # daily, ~6am Toronto
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["build_ics.py", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed
        run: python build_ics.py docs/ivey-alumni-events.ics
      - name: Commit if changed
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > docs/last-updated.txt
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Refresh Ivey alumni events"
          git push
